name: Data quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m pip check
      - run: python -m pytest -q
      - run: python src/data_generator.py
      - run: python -m src.data_quality --report reports/day2-data-quality.json
      - name: Verify seeded output hashes and quality report
        run: python -c "import json,subprocess; from pathlib import Path; expected=json.loads(subprocess.check_output(['git','show','HEAD:data/manifest.json'])); actual=json.loads(Path('data/manifest.json').read_text()); assert expected['files']==actual['files']; subprocess.run(['git','diff','--exit-code','--','reports/day2-data-quality.json'],check=True)"
